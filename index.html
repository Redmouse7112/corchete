<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F8FC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18231F">
<title>Corchete</title>
<meta name="description" content="Cuaderno de análisis para Gramática — Profesorado en Letras, UNaF.">
<meta name="author" content="RED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corchete">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Corchete — cuaderno Rivadavia de día, pizarrón de noche.
   Layout: barra lateral de cuaderno (escritorio) / barra inferior (celular) + hoja central de ~46rem con renglones. */
:root {
  --paper: #F5F8FC;
  --sheet: #FFFFFF;
  --ink: #17223D;
  --ink-2: #47557A;
  --ink-3: #75819E;
  --rule: #DCE7F3;
  --margin: #D9596C;
  --accent: #1E44B0;
  --accent-soft: #E3EAFB;
  --on-accent: #FFFFFF;
  --line: #DCE3EE;
  --chip: #EDF1F8;
  --ok: #17704A;
  --ok-bg: #E1F3E8;
  --bad: #B02A22;
  --bad-bg: #FBE6E3;
  --shadow: 0 1px 2px rgba(23, 34, 61, .06), 0 6px 20px rgba(23, 34, 61, .06);

  --h1b: #DCE7FF; --h1f: #1C3C8C;
  --h2b: #FFDDE1; --h2f: #97192A;
  --h3b: #D6F1DE; --h3f: #1B6737;
  --h4b: #FFEAC4; --h4f: #7E4B00;
  --h5b: #FFE0CC; --h5f: #8A380B;
  --h6b: #E9DEFF; --h6f: #5528A0;
  --h7b: #CFF0ED; --h7f: #0C5F59;
  --h8b: #F2E7C6; --h8f: #685010;
  --h9b: #E3E8F0; --h9f: #394559;
  --h10b: #FBDCEE; --h10f: #8A1D5F;
  --h11b: #D2EDF9; --h11f: #0A5572;
  --h12b: #E4EECD; --h12f: #475A10;

  --f-display: "Literata", "Iowan Old Style", Georgia, serif;
  --f-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r: 10px;
  --renglon: 30px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #18231F; --sheet: #1F2C27; --ink: #E9EFE9; --ink-2: #B5C3BA; --ink-3: #879890;
    --rule: rgba(233, 239, 233, .045); --margin: #E88593; --accent: #9CC1FF; --accent-soft: #24354F; --on-accent: #0D1A30;
    --line: #33443D; --chip: #283832; --ok: #7FD9A4; --ok-bg: #1E3B2C; --bad: #FF9C92; --bad-bg: #4A2622;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --h1b: #22375C; --h1f: #BCD2FF; --h2b: #4C2128; --h2f: #FFC3CA; --h3b: #1E4830; --h3f: #B4EAC4;
    --h4b: #483916; --h4f: #FFD88C; --h5b: #4B2D1C; --h5f: #FFC6A3; --h6b: #382B55; --h6f: #D6C4FF;
    --h7b: #1A4542; --h7f: #A3E6DF; --h8b: #443A20; --h8f: #E9D79D; --h9b: #323B48; --h9f: #C9D2DF;
    --h10b: #48233F; --h10f: #FFBFE4; --h11b: #1A3D4C; --h11f: #ABDEF3; --h12b: #35411D; --h12f: #D1E49F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #18231F; --sheet: #1F2C27; --ink: #E9EFE9; --ink-2: #B5C3BA; --ink-3: #879890;
  --rule: rgba(233, 239, 233, .045); --margin: #E88593; --accent: #9CC1FF; --accent-soft: #24354F; --on-accent: #0D1A30;
  --line: #33443D; --chip: #283832; --ok: #7FD9A4; --ok-bg: #1E3B2C; --bad: #FF9C92; --bad-bg: #4A2622;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --h1b: #22375C; --h1f: #BCD2FF; --h2b: #4C2128; --h2f: #FFC3CA; --h3b: #1E4830; --h3f: #B4EAC4;
  --h4b: #483916; --h4f: #FFD88C; --h5b: #4B2D1C; --h5f: #FFC6A3; --h6b: #382B55; --h6f: #D6C4FF;
  --h7b: #1A4542; --h7f: #A3E6DF; --h8b: #443A20; --h8f: #E9D79D; --h9b: #323B48; --h9f: #C9D2DF;
  --h10b: #48233F; --h10f: #FFBFE4; --h11b: #1A3D4C; --h11f: #ABDEF3; --h12b: #35411D; --h12f: #D1E49F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 var(--f-ui);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
em { font-style: italic; font-family: var(--f-display); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }

/* ---------- Splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center; text-align: center;
  background: var(--paper);
  padding: 24px;
  transition: opacity .5s ease, visibility .5s;
}
.splash.out { opacity: 0; visibility: hidden; }
.splash__mark { font-family: var(--f-display); font-weight: 600; font-size: clamp(2.6rem, 9vw, 4.4rem); letter-spacing: -.01em; line-height: 1; }
.splash__mark b { color: var(--margin); font-weight: 400; display: inline-block; transition: transform .7s cubic-bezier(.2, .8, .2, 1); }
.splash:not(.ready) .splash__mark b:first-child { transform: translateX(.5em); }
.splash:not(.ready) .splash__mark b:last-child { transform: translateX(-.5em); }
.splash__sub { margin-top: 14px; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.splash__credit { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; font-size: .82rem; color: var(--ink-2); }
.splash__credit strong { font-family: var(--f-mono); color: var(--margin); letter-spacing: .06em; }

/* ---------- Shell ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; background: none; border: 0; padding: 0; cursor: pointer; }
.brand b { color: var(--margin); font-weight: 400; }
.iconbtn { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: .8rem; color: var(--ink-2); cursor: pointer; }
.iconbtn:hover { color: var(--ink); }
.topbar__tools { display: flex; gap: 8px; }
.iconbtn[data-install] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

.main {
  min-width: 0;
  padding-inline: 16px;
  padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
  background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--renglon) - 1px), var(--rule) calc(var(--renglon) - 1px) var(--renglon));
  background-attachment: local;
}
.sheet { max-width: 46rem; margin: 0 auto; display: grid; gap: 28px; }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--sheet); border-top: 1px solid var(--line);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
}
.navbtn {
  display: grid; justify-items: center; gap: 2px;
  border: 0; background: none; padding: 6px 2px; border-radius: 8px; cursor: pointer;
  color: var(--ink-3); font-size: .66rem; font-weight: 600; letter-spacing: .01em;
}
.navbtn svg { width: 22px; height: 22px; }
.navbtn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

@media (min-width: 900px) {
  .app { grid-template-columns: 232px 1fr; }
  .topbar, .bottomnav { display: none; }
  .side {
    display: flex; flex-direction: column; gap: 22px;
    position: sticky; top: 0; height: 100vh; padding: 28px 18px 22px 22px;
    border-right: 2px solid var(--margin);
    background: var(--sheet);
  }
  .side .brand { font-size: 1.6rem; text-align: left; }
  .side__tag { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
  .side nav { display: grid; gap: 2px; }
  .side .navbtn { grid-template-columns: 22px 1fr; justify-items: start; align-items: center; gap: 12px; font-size: .92rem; font-weight: 500; padding: 9px 10px; color: var(--ink-2); }
  .side .navbtn[aria-current="page"] { color: var(--accent); font-weight: 600; }
  .side__foot { margin-top: auto; display: grid; gap: 10px; font-size: .8rem; color: var(--ink-3); }
  .credit strong { font-family: var(--f-mono); color: var(--margin); letter-spacing: .06em; }
  .main { padding-block: 40px 64px; padding-inline: 40px; }
}

/* ---------- Tipografía de página ---------- */
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.pagehead { display: grid; gap: 8px; }
.pagehead h1 { font-size: clamp(1.7rem, 4.5vw, 2.3rem); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 60ch; margin: 0; }
.section-title { font-size: 1.15rem; font-weight: 600; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.muted { color: var(--ink-3); }
.section-title .muted { font-family: var(--f-ui); font-weight: 400; }
.small { font-size: .85rem; }
.mono { font-family: var(--f-mono); }

/* ---------- Botones y chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: .92rem;
  border: 1px solid var(--line); background: var(--sheet); cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-3); }
.btn--primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn--primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--sheet); border-radius: 999px;
  padding: 6px 12px; font-size: .84rem; cursor: pointer; color: var(--ink-2); white-space: nowrap;
}
.chip b { font-family: var(--f-mono); font-weight: 600; margin-right: 6px; color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed="true"] b { color: var(--paper); opacity: .7; }

.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }

/* ---------- Marcas de análisis ---------- */
.tag { font-family: var(--f-mono); font-size: .7rem; font-weight: 600; letter-spacing: .02em; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
[data-c="1"] { --hb: var(--h1b); --hf: var(--h1f); }
[data-c="2"] { --hb: var(--h2b); --hf: var(--h2f); }
[data-c="3"] { --hb: var(--h3b); --hf: var(--h3f); }
[data-c="4"] { --hb: var(--h4b); --hf: var(--h4f); }
[data-c="5"] { --hb: var(--h5b); --hf: var(--h5f); }
[data-c="6"] { --hb: var(--h6b); --hf: var(--h6f); }
[data-c="7"] { --hb: var(--h7b); --hf: var(--h7f); }
[data-c="8"] { --hb: var(--h8b); --hf: var(--h8f); }
[data-c="9"] { --hb: var(--h9b); --hf: var(--h9f); }
[data-c="10"] { --hb: var(--h10b); --hf: var(--h10f); }
[data-c="11"] { --hb: var(--h11b); --hf: var(--h11f); }
[data-c="12"] { --hb: var(--h12b); --hf: var(--h12f); }
.tag[data-c] { background: var(--hb); color: var(--hf); }

.sentence { font-family: var(--f-display); font-size: clamp(1.15rem, 3.4vw, 1.45rem); line-height: 1.5; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 8px; }
.sentence .plain { padding-top: 6px; color: var(--ink-2); }
.cons {
  display: inline-grid; justify-items: center; gap: 6px;
  border: 0; background: none; padding: 0; cursor: default; text-align: center;
}
.cons__text { position: relative; padding: 4px 10px; border-radius: 6px; }
.cons__text::before, .cons__text::after { color: var(--margin); font-weight: 400; }
.cons__text::before { content: "["; margin-right: 3px; }
.cons__text::after { content: "]"; margin-left: 3px; }
.cons[data-c] .cons__text { background: var(--hb); color: var(--hf); }
.cons__label { min-height: 1.1rem; line-height: 1; display: flex; gap: 4px; align-items: center; }
button.cons { cursor: pointer; }
button.cons .cons__text { border: 1.5px dashed var(--ink-3); }
button.cons[data-c] .cons__text { border-style: solid; border-color: transparent; }
button.cons.is-active .cons__text { border-color: var(--accent); border-style: solid; box-shadow: 0 0 0 3px var(--accent-soft); }
.cons.is-ok .cons__text { box-shadow: 0 0 0 2px var(--ok); }
.cons.is-bad .cons__text { box-shadow: 0 0 0 2px var(--bad); }
.cons__fix { font-family: var(--f-ui); font-size: .72rem; color: var(--bad); font-weight: 600; }

.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pal {
  display: flex; align-items: center; gap: 8px; text-align: left;
  border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: .84rem; min-width: 0;
}
.pal:hover { border-color: var(--ink-3); }
.pal .tag { flex: none; }
.pal span:last-child { min-width: 0; hyphens: auto; -webkit-hyphens: auto; color: var(--ink-2); line-height: 1.25; font-size: .8rem; }

.explain { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.explain li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: .92rem; }
.explain .q { font-family: var(--f-display); }

/* ---------- Inicio ---------- */
.hero { display: grid; gap: 18px; padding: 26px 22px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; top: 0; bottom: 0; left: 40px; width: 1.5px; background: var(--margin); opacity: .55; }
.hero > * { position: relative; padding-left: 36px; }
.hero__foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
@media (max-width: 520px) {
  .hero::before { left: 18px; }
  .hero > * { padding-left: 14px; }
}

.units { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.unitrow {
  display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 14px; align-items: center;
  width: 100%; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: left;
}
.unitrow:hover .unitrow__title { color: var(--accent); }
.unitrow__n { font-family: var(--f-display); font-size: 1.5rem; color: var(--margin); line-height: 1; text-align: center; }
.unitrow__title { font-weight: 600; }
.unitrow__meta { font-size: .8rem; color: var(--ink-3); }
.meter { width: 84px; height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.unitrow__score { display: grid; justify-items: end; gap: 4px; font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.quick button { text-align: left; display: grid; gap: 4px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.quick button:hover { border-color: var(--accent); }
.quick strong { font-size: .98rem; }
.quick span { font-size: .84rem; color: var(--ink-3); }

/* ---------- Apuntes ---------- */
.unithead { display: grid; gap: 10px; }
.unithead h1 { font-size: clamp(1.6rem, 4.4vw, 2.1rem); font-weight: 600; }
.unithead h1 small { display: block; font-family: var(--f-mono); font-size: .8rem; font-weight: 500; color: var(--margin); letter-spacing: .08em; margin-bottom: 6px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.sources li { font-size: .78rem; background: var(--chip); color: var(--ink-2); padding: 3px 9px; border-radius: 4px; }
.toc { display: grid; gap: 2px; margin: 0; padding: 12px 16px; list-style: none; border-left: 2px solid var(--margin); }
.toc a { color: var(--ink-2); text-decoration: none; font-size: .9rem; }
.toc a:hover { color: var(--accent); }
.note { display: grid; gap: 12px; scroll-margin-top: 80px; }
.note h2 { font-size: 1.3rem; font-weight: 600; }
.note p { margin: 0; max-width: 66ch; }
.note ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 6px; max-width: 66ch; }
.examples { margin: 0; padding: 12px 16px; list-style: none; display: grid; gap: 6px; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; }
.examples li { font-size: .95rem; }
.examples li.bad::before { content: "✱ "; color: var(--margin); font-weight: 700; }
.src { font-size: .78rem; color: var(--ink-3); font-family: var(--f-mono); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; background: var(--chip); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-family: var(--f-display); font-style: italic; white-space: nowrap; }

/* ---------- Pruebas ---------- */
.treelist { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.treecard { text-align: left; display: grid; gap: 6px; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.treecard:hover { border-color: var(--accent); }
.treecard strong { font-family: var(--f-display); font-size: 1.12rem; }
.treecard span { font-size: .85rem; color: var(--ink-3); }
.trail { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.trail li { font-size: .84rem; color: var(--ink-3); display: flex; gap: 8px; }
.trail li b { color: var(--ink-2); font-weight: 600; }
.step { display: grid; gap: 14px; }
.step h2 { font-size: 1.25rem; font-weight: 600; }
.step .help { font-size: .9rem; color: var(--ink-2); background: var(--chip); padding: 10px 12px; border-radius: 8px; margin: 0; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: .95rem; }
.opt:hover { border-color: var(--accent); }
.result { border-left: 4px solid var(--accent); padding: 4px 0 4px 16px; display: grid; gap: 6px; }
.result h2 { font-size: 1.45rem; }

/* ---------- Fichas ---------- */
.flash { perspective: 1200px; }
.flash__inner {
  position: relative; min-height: 240px; border-radius: 14px; transition: transform .45s cubic-bezier(.2, .7, .2, 1);
  transform-style: preserve-3d; cursor: pointer;
}
.flash.is-flipped .flash__inner { transform: rotateY(180deg); }
.flash__face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; align-content: center; gap: 10px; padding: 26px 24px 26px 48px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--sheet); box-shadow: var(--shadow);
  background-image: repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px);
}
.flash__face::before { content: ""; position: absolute; top: 0; bottom: 0; left: 30px; width: 1.5px; background: var(--margin); opacity: .6; }
.flash__face--back { transform: rotateY(180deg); }
.flash__face p { margin: 0; font-family: var(--f-display); font-size: 1.2rem; line-height: 1.5; }
.flash__face--back p { font-family: var(--f-ui); font-size: 1rem; }
.flash__hint { font-size: .75rem; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.boxes div { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.boxes b { font-family: var(--f-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.boxes span { font-size: .75rem; color: var(--ink-3); }

/* ---------- Práctica ---------- */
.setup { display: grid; gap: 18px; }
.field { display: grid; gap: 8px; }
.field > span { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .85rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--margin); transition: width .3s; }
.question { font-family: var(--f-display); font-size: clamp(1.15rem, 3.2vw, 1.35rem); line-height: 1.45; margin: 0; }
.answers { display: grid; gap: 8px; }
.answer { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: baseline; text-align: left; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-size: .96rem; }
.answer:hover:not(:disabled) { border-color: var(--accent); }
.answer b { font-family: var(--f-mono); color: var(--ink-3); }
.answer:disabled { cursor: default; }
.answer.is-picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.answer.is-ok { border-color: var(--ok); background: var(--ok-bg); }
.answer.is-bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback { border-radius: 8px; padding: 12px 14px; font-size: .92rem; display: grid; gap: 4px; }
.feedback.ok { background: var(--ok-bg); color: var(--ink); border-left: 4px solid var(--ok); }
.feedback.bad { background: var(--bad-bg); color: var(--ink); border-left: 4px solid var(--bad); }
.feedback strong { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--bad); }
.score { font-family: var(--f-display); font-size: clamp(3rem, 12vw, 4.5rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .35em; color: var(--ink-3); font-weight: 400; }
.reviewlist { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.reviewlist li { display: grid; gap: 4px; padding-bottom: 14px; border-bottom: 1px solid var(--line); font-size: .92rem; }
.history { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; font-size: .86rem; }
.history li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: .88rem; z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

<script>
/* Corchete · contenidos · Unidades 1 a 3
   Formato de texto: _cursiva_ (ejemplos), **negrita**.
   En "ej", una línea que empieza con * es agramatical.  */
window.CORCHETE = window.CORCHETE || { units: [], analysis: [], trees: [] };

CORCHETE.units.push({
  id: "u1",
  n: 1,
  title: "Nociones sintácticas",
  short: "Sintaxis",
  blurb: "Constituyentes, sintagmas, funciones y papeles temáticos, sujeto y clases de verbos.",
  sources: ["Ciapuscio y Ferrari (2004), cap. 2", "Di Tullio, Manual, caps. III–VI", "Giammatteo, cap. 2"],
  sections: [
    {
      t: "Qué estudia la sintaxis",
      p: [
        "La sintaxis estudia cómo se combinan las palabras: el orden, los vínculos entre ellas y lo que unas **exigen** de otras. La oración no es una cadena de palabras sueltas: tiene **estructura jerárquica**. Las palabras forman grupos (constituyentes) y esos grupos forman otros mayores.",
        "Para saber si un grupo de palabras es un constituyente se aplican **pruebas**: sustitución por un pronombre, conmutación, desplazamiento, coordinación, interrogación y omisión. Si el grupo se comporta en bloque, es un constituyente."
      ],
      k: [
        "Expansión: agregar modificadores sin cambiar la estructura.",
        "Reducción: reemplazar un grupo entero por un pronombre.",
        "Interrogación: la respuesta a una pregunta es siempre un constituyente."
      ],
      ej: [
        "_El bibliotecario puso el libro viejo en el estante._",
        "_El bibliotecario de guardapolvo azul puso el libro viejo en el estante._ (expansión)",
        "_Él puso el libro viejo en el estante._ (reducción por sustitución pronominal)",
        "_¿Dónde lo puso? En el estante._"
      ],
      src: "Ciapuscio y Ferrari, cap. 2 §1"
    },
    {
      t: "Los sintagmas",
      p: [
        "Cada palabra léxica es **núcleo** de un sintagma y le da su categoría: si el núcleo es un sustantivo, el grupo es un sintagma nominal (SN); si es un verbo, un SV; y así con el adjetivo (SAdj), el adverbio (SAdv) y la preposición (SP).",
        "El núcleo puede reemplazar a todo el sintagma, salvo en el SP: la preposición necesita siempre un **término** (_*Voy hacia_). Por eso la preposición es una clase atípica entre las léxicas.",
        "El **potencial funcional** es el conjunto de funciones que puede cumplir un sintagma. Un SN, por ejemplo, puede ser sujeto, objeto directo o término de preposición."
      ],
      ej: [
        "SN: _la [casa] grande_",
        "SV: _[come] mucho_",
        "SAdj: _bastante [grande]_",
        "SAdv: _muy [lentamente]_",
        "SP: _[hacia] el río_"
      ],
      src: "Giammatteo, cap. 2 §1 · Di Tullio, cap. IV"
    },
    {
      t: "Función sintáctica y papel temático",
      p: [
        "La **función sintáctica** es la relación formal de un constituyente con los demás: sujeto, objeto directo, objeto indirecto, etc. El **papel temático** es el modo en que ese participante interviene en el evento: agente, tema o paciente, experimentante, beneficiario, origen, meta, locativo, instrumento.",
        "Función y papel **no coinciden necesariamente**. El sujeto es muchas veces agente, pero también puede ser tema (en la pasiva o con verbos inacusativos) o experimentante (con verbos de sentimiento)."
      ],
      ej: [
        "_El árbitro_ (agente) _suspendió el partido_ (tema).",
        "_La boda_ (tema) _fue pospuesta por el novio_ (agente).",
        "_Surgieron problemas de organización._ (sujeto tema, pospuesto)",
        "_Los estudiantes_ (experimentante) _sentimos pena_ (tema) _por la renuncia._"
      ],
      src: "Ciapuscio y Ferrari, cap. 2 §3"
    },
    {
      t: "Sujeto y predicado",
      p: [
        "La marca formal del sujeto es la **concordancia** en número y persona con el verbo. Por la rica flexión verbal del español, el sujeto puede quedar **tácito** (desinencial): _Llegamos tarde_.",
        "Algunas oraciones no tienen sujeto: los verbos meteorológicos (_Llueve_), **haber** existencial (_Hay muchos indagados_) y **hacer** temporal o climático (_Hace frío_, _Hace años_).",
        "Un SN plural que designa personas puede concordar en 1.ª o 2.ª persona si incluye al hablante o al oyente: _Los padres no siempre sabemos lo que es bueno para los hijos_."
      ],
      src: "Di Tullio, cap. VI · RAE, Manual §4.2.3"
    },
    {
      t: "Estructura argumental y clases de verbos",
      p: [
        "El verbo es un predicado que **selecciona argumentos**: el argumento externo se realiza como sujeto y los internos como complementos. Los **adjuntos** no son seleccionados: agregan circunstancias y se pueden omitir.",
        "Según sus argumentos, los verbos se agrupan así:"
      ],
      k: [
        "**Transitivos**: piden objeto directo (_leer un libro_).",
        "**Ditransitivos**: OD + OI (_dar, decir, pedir algo a alguien_).",
        "**Inergativos**: intransitivos de actividad controlada por el sujeto (_trabajar, suspirar, rugir_).",
        "**Inacusativos**: intransitivos cuyo sujeto es tema o afectado, no agente (_llegar, surgir, faltar, crecer_). Admiten sujeto pospuesto sin determinante: _Llegaron invitados_.",
        "**Copulativos**: ser, estar, parecer + atributo.",
        "**Preposicionales**: piden complemento de régimen (_confiar en, abusar de_)."
      ],
      src: "Di Tullio, cap. VI · PPT clase 27/8"
    },
    {
      t: "El sintagma nominal",
      p: [
        "El SN se organiza alrededor de un núcleo sustantivo, con determinante opcional y complementos: sintagmas adjetivos, preposicionales o proposiciones relativas.",
        "Los complementos pueden ser **restrictivos** (sin pausa; reducen la referencia: de todos los policías, solo los separados de sus cargos) o **no restrictivos** (entre comas; agregan información sin recortar). La **aposición** es un SN que se suma a otro para identificarlo o describirlo."
      ],
      ej: [
        "_Los policías separados de sus cargos interpusieron recursos legales._ (restrictivo)",
        "_Los policías, separados de sus cargos, interpusieron recursos legales._ (no restrictivo)",
        "_El Louvre, museo de ensueño, se halla en refacción._ (aposición)"
      ],
      src: "Ciapuscio y Ferrari, cap. 2 §4"
    }
  ],
  cards: [
    { f: "¿Qué prueba muestra que _el libro viejo_ es un constituyente en _Puso el libro viejo en el estante_?", b: "Se reemplaza en bloque por un pronombre: _Lo puso en el estante_." },
    { f: "Diferencia entre función sintáctica y papel temático", b: "La función es la relación formal (sujeto, OD…). El papel temático es cómo participa en el evento (agente, tema, experimentante…). No coinciden necesariamente." },
    { f: "¿Cuál es la marca formal del sujeto?", b: "La concordancia en número y persona con el verbo." },
    { f: "Verbo inacusativo", b: "Intransitivo cuyo sujeto es tema o afectado, no agente: _llegar, surgir, faltar_. Suele llevar sujeto pospuesto: _Faltan vacunas_." },
    { f: "Verbo inergativo", b: "Intransitivo de actividad causada y controlada por el sujeto: _trabajar, suspirar, rugir_." },
    { f: "¿Qué es un argumento?", b: "Un participante seleccionado por el predicado. El externo es el sujeto; los internos, los complementos." },
    { f: "¿Qué es un adjunto?", b: "Un modificador no seleccionado por el verbo: agrega circunstancias y es omisible." },
    { f: "¿Por qué la preposición es atípica entre las clases léxicas?", b: "Su núcleo no puede reemplazar al sintagma: siempre exige un término (_*Voy hacia_)." },
    { f: "Tres construcciones sin sujeto", b: "Verbos meteorológicos (_llueve_), _haber_ existencial (_hay gente_) y _hacer_ temporal (_hace años_)." },
    { f: "Complemento restrictivo vs. no restrictivo del nombre", b: "El restrictivo va sin pausa y recorta la referencia. El no restrictivo va entre comas y solo agrega información." },
    { f: "Aposición", b: "SN que acompaña a otro SN para identificarlo o describirlo: _El Louvre, museo de ensueño, …_" },
    { f: "Papel temático del sujeto en _Los estudiantes sentimos pena_", b: "Experimentante." }
  ],
  quiz: [
    { q: "En _La boda fue pospuesta por el novio_, ¿qué papel temático tiene el sujeto?", o: ["Agente", "Tema", "Experimentante", "Beneficiario"], a: 1, x: "El sujeto de la pasiva es lo afectado por la acción: tema. El agente aparece en el complemento _por el novio_." },
    { q: "¿Cuál de estos verbos es inacusativo?", o: ["trabajar", "suspirar", "surgir", "cantar"], a: 2, x: "_Surgir_ tiene un sujeto tema que no controla el evento y suele ir pospuesto: _Surgieron problemas_." },
    { q: "¿Cuál de estas oraciones no tiene sujeto?", o: ["Se aproximan las elecciones.", "Hay muchos indagados.", "Aumentan los evacuados.", "Llegaron los alumnos."], a: 1, x: "_Haber_ existencial es impersonal: _muchos indagados_ es su objeto directo (_los hay_)." },
    { q: "En _Los policías, separados de sus cargos, interpusieron recursos_, el grupo entre comas es:", o: ["Un complemento restrictivo", "Un complemento no restrictivo", "El objeto directo", "Un complemento de régimen"], a: 1, x: "Va entre pausas y no recorta el conjunto de policías: agrega información sobre todos ellos." },
    { q: "¿Qué sintagma no puede ser reemplazado por su núcleo?", o: ["SN", "SAdj", "SAdv", "SP"], a: 3, x: "La preposición exige un término: _hacia el río_, pero no _*hacia_." },
    { q: "¿Qué NO es una prueba para reconocer constituyentes?", o: ["Sustituir por un pronombre", "Contar las sílabas", "Hacer una pregunta", "Desplazar el grupo"], a: 1, x: "Las pruebas miran el comportamiento sintáctico del grupo, no su extensión." },
    { q: "En _Juan resolvió los problemas_, _los problemas_ es:", o: ["Argumento externo", "Argumento interno", "Adjunto", "Aposición"], a: 1, x: "Es seleccionado por el verbo y se realiza como complemento: argumento interno (OD)." },
    { q: "_Los padres no siempre sabemos…_ El verbo va en 1.ª persona porque:", o: ["Es un error de concordancia", "El SN incluye al hablante", "El sujeto es tácito", "Es una construcción impersonal"], a: 1, x: "Un SN plural de personas puede concordar en 1.ª persona cuando el hablante se incluye." }
  ]
});

CORCHETE.units.push({
  id: "u2",
  n: 2,
  title: "Clases de palabras",
  short: "Palabras",
  blurb: "Léxicas y funcionales: sustantivo, adjetivo, pronombre, verbo, adverbio, preposición, determinativos y conjunciones.",
  sources: ["Giammatteo, caps. 2–4 (TP2–TP6, TP9)", "RAE, Manual caps. 12 y 13", "Di Tullio, Manual cap. X", "Demonte, GDLE §3.6", "Alcina y Blecua, §4.9"],
  sections: [
    {
      t: "Palabras léxicas y funcionales",
      p: [
        "Las **palabras léxicas** tienen significado propio y son núcleos de sintagma. Morfológicamente se dividen en **flexionales** (sustantivo, adjetivo, verbo) y **no flexionales** (adverbio y preposición).",
        "Las **palabras funcionales** tienen significado gramatical: se precisa en relación con otras palabras. Son los **determinativos** (especifican al sustantivo: _el árbol_) y las **conjunciones** (conectan: _gatos y perros_). Las de naturaleza pronominal pueden aparecer solas: _Vinieron pocos_."
      ],
      src: "Giammatteo, caps. 2 y 4"
    },
    {
      t: "El sustantivo",
      p: [
        "Nombra entidades de todo tipo: personas, cosas, sentimientos, acciones. Admite género y número y forma SN."
      ],
      k: [
        "**Comunes y propios**: el común clasifica (_mujer, país_); el propio identifica sin describir (_Paula, Colombia_) y no se traduce.",
        "**Contables y no contables**: los contables admiten plural y numerales (_tres mesas_); los no contables, _mucho/poco_ en singular (_mucha arena_) y el adjetivo _abundante_. Contraste: _Compraré pan / Compraré libros / *Compraré libro_.",
        "**Colectivos**: en singular designan un conjunto (_rebaño, profesorado_). Admiten _numeroso_. La concordancia en plural (_Toda la familia iban_) se recomienda evitar.",
        "**Cuantificativos**: acotadores (_una brizna de hierba_), de medida (_un litro de leche_) y de grupo (_un montón de regalos_). **Clasificativos**: _clase, tipo, especie_.",
        "**Abstractos**: se forman con sufijos como _-ura, -ez/-eza, -ía_ (cualidades) o _-ción, -miento, -aje_ (acciones).",
        "**Eventivos**: pueden ser sujeto de _tener lugar_ o término de _durante_ (_la reunión, la batalla_)."
      ],
      ej: [
        "_un corcho, dos cristales_ (no contable usado como contable)",
        "_Es una belleza._ (no contable que pasa a designar una persona)"
      ],
      src: "RAE, Manual cap. 12 · Giammatteo, cap. 2 §2"
    },
    {
      t: "El adjetivo",
      p: [
        "Modifica al sustantivo y concuerda con él. Hay tres grandes clases:"
      ],
      k: [
        "**Calificativos**: asignan propiedades, son graduables (_muy alto, altísimo_), tienen antónimos y pueden anteponerse.",
        "**Relacionales**: vinculan el sustantivo con un ámbito, ‘perteneciente o relativo a’ (_línea telefónica, visita papal_). No se gradúan, van pospuestos y no son atributos salvo en contraste (_El problema es político_). Incluyen los gentilicios.",
        "**Adverbiales**: equivalen a un adverbio en _-mente_. Intensionales o modales (_presunto asesino, posible novia, verdadero amigo, mero trámite_), circunstanciales (_antiguo acuerdo, futuro presidente_) y aspectuales (_constantes viajes_)."
      ],
      ej: [
        "_cartelera teatral_ (relacional) / _gesto teatral_ (calificativo)",
        "_una simple mentira_ / _una mentira simple_",
        "_la antigua casa_ (la de antes) / _la casa antigua_ (vieja)",
        "_un seguro acuerdo_ (cierto) / _un acuerdo seguro_ (firme)"
      ],
      src: "RAE, Manual §13.5 · Demonte, GDLE §3.6"
    },
    {
      t: "Posición del adjetivo",
      p: [
        "La posición **posnominal** es la no marcada: allí van los adjetivos restrictivos (calificativos, relacionales). En posición **prenominal** van los no restrictivos (epítetos) y los adverbiales.",
        "Delante del sustantivo se admiten adjetivos con modificador de grado (_su muy digno discípulo_) o coordinados (_un cómodo y lujoso coche_), pero no los que llevan complemento (_*un fácil de arreglar problema_)."
      ],
      src: "RAE, Manual §13.6 · Demonte, GDLE §3.6"
    },
    {
      t: "Los pronombres",
      p: [
        "Son una subclase cerrada del sustantivo, con significado gramatical. Se interpretan en relación con la situación o el texto:"
      ],
      k: [
        "**Deixis**: señalan la situación de habla (_Yo no te veía por aquí_).",
        "**Anáfora**: remiten a algo dicho antes (_Juan resolvió los problemas pero la maestra no lo felicitó_).",
        "**Catáfora**: anticipan algo que viene después (_Juan necesita eso, que lo quieran_)."
      ],
      ej: [
        "Personales tónicos (_yo, vos, usted, él_) y átonos o clíticos (_me, te, lo, la, le, se_).",
        "Solo en 3.ª persona se distinguen acusativo (_lo, la_) y dativo (_le_), y oblicuo (_lo_) y reflexivo (_se_).",
        "Demostrativos (_este, ese, aquel_), posesivos (_mi, tuyo_), relativos (_que, quien, cual, cuyo_), interrogativos y exclamativos, indefinidos (_alguien, nada, cualquiera_)."
      ],
      src: "Di Tullio, cap. X · Giammatteo, cap. 4"
    },
    {
      t: "El verbo",
      p: [
        "Es el núcleo de la predicación. Sus formas son **finitas** (con tiempo, modo, aspecto, número y persona) o **no finitas** (infinitivo, participio, gerundio).",
        "Los tiempos **absolutos** o deícticos se miden desde el momento del habla: _canto, canté, cantaré_. Los **relativos** o anafóricos toman como referencia otro momento: _cantaba, había cantado, cantaría_ respecto de un pasado; _he cantado, habré cantado_ respecto del presente o el futuro. _Habría cantado_ es relativo de tercer grado.",
        "El **aspecto** es interno: dice cómo ocurre el evento (terminado, en curso, repetido). El tiempo lo ubica desde afuera."
      ],
      ej: [
        "_Cuando llegué al colegio, la maestra se retiraba._ (simultáneo a un pasado)",
        "_Cuando llegué al colegio, la maestra ya se había retirado._ (anterior a un pasado)",
        "_La maestra anunció que se retiraría temprano._ (posterior a un pasado)"
      ],
      src: "Giammatteo, cap. 3 (TP9)"
    },
    {
      t: "El adverbio",
      p: [
        "Es invariable. Modifica a un verbo, un adjetivo, otro adverbio o toda la oración (_Realmente, no es fácil distinguir una de otra_)."
      ],
      k: [
        "**Cualificativos**: _bien, mal_, los terminados en _-mente_ y los adjetivos adverbializados (_hablar bajo, pisar fuerte_).",

      r_mov: { r: "Probá con un clítico", x: "Si el clítico sube al verbo conjugado (_Juan la va a saludar_), es perífrasis. Si no (_va a Buenos Aires a saludarla_), es un verbo de movimiento pleno." }
    }
  },
  {
    id: "se",
    title: "¿Qué se es?",
    desc: "Las pruebas de Di Tullio ordenadas para descartar de a una.",
    u: "u6",
    start: "a",
    nodes: {
      a: { q: "¿El _se_ está delante de _lo, la, los, las_ y reemplaza a _le_?", h: "_Juan se lo dio (a María)._", opts: [{ l: "Sí", go: "r_sust" }, { l: "No", go: "b" }] },
      b: { q: "¿Existe el verbo sin _se_?", h: "_quejar_, _arrepentir_, _percatar_ no existen solos.", opts: [{ l: "No existe", go: "r_inh" }, { l: "Sí existe", go: "c" }] },
      c: { q: "Sin _se_, ¿el verbo cambia de significado o de régimen?", h: "_acordar algo / acordarse de algo_; _negar / negarse a_", opts: [{ l: "Sí", go: "r_dia" }, { l: "No", go: "d" }] },
      d: { q: "¿Admite _a sí mismo_?", h: "_Juan se considera un genio (a sí mismo)._", opts: [{ l: "Sí", go: "r_refl" }, { l: "No", go: "e" }] },
      e: { q: "Con sujeto plural, ¿admite _mutuamente_ o _el uno al otro_?", opts: [{ l: "Sí", go: "r_reci" }, { l: "No", go: "f" }] },
      f: { q: "¿Se puede quitar sin cambiar nada, y el OD está determinado?", h: "_Juan (se) fumó veinte cigarrillos._", opts: [{ l: "Sí", go: "r_est" }, { l: "No", go: "g" }] },
      g: { q: "¿Hay un sujeto con el que concuerda el verbo?", h: "_Se venden casas_ (sí) · _Se trabaja mucho_ (no)", opts: [{ l: "Sí", go: "h" }, { l: "No", go: "r_imp" }] },
      h: { q: "¿Admite _para que…_ o _deliberadamente_ (hay un agente implícito)?", h: "_Se hundió el barco para cobrar el seguro._", opts: [{ l: "Sí", go: "r_pas" }, { l: "No: ocurre solo", go: "r_erg" }] },
      r_sust: { r: "Se sustituto", x: "Variante de _le_ ante clítico acusativo. No forma construcción pronominal." },
      r_inh: { r: "Se inherente", x: "Forma parte del verbo y rechaza la transitividad." },
      r_dia: { r: "Se diacrítico", x: "Distingue dos verbos con distinto significado o régimen." },
      r_refl: { r: "Se reflexivo", x: "El sujeto es agente y afectado. Puede ser OD u OI." },
      r_reci: { r: "Se recíproco", x: "Cada uno actúa sobre el otro." },
      r_est: { r: "Se estilístico", x: "Omisible; exige una acción delimitada." },
      r_imp: { r: "Se impersonal", x: "Agente humano indefinido; verbo en 3.ª del singular. Si hay OD de persona, lleva _a_." },
      r_pas: { r: "Se pasivo", x: "El paciente es sujeto; solo con verbos transitivos." },
      r_erg: { r: "Se intransitivizador", x: "Ergativo o anticausativo: proceso espontáneo, admite _solo_. También los cambios de posición: _se levantó_." }
    }
  },
  {
    id: "proposicion",
    title: "¿Qué proposición es?",
    desc: "Coordinada, sustantiva, relativa o adverbial, según Ciapuscio y otros.",
    u: "u7",
    start: "a",
    nodes: {
      a: { q: "¿Está unida a otra del mismo nivel por _y, ni, o, pero, sino_?", opts: [{ l: "Sí", go: "r_coor" }, { l: "No", go: "b" }] },
      b: { q: "¿Se puede reemplazar por _eso_ o _lo_ (es sujeto, OD o término)?", h: "_Dictaminó que la ley es inconstitucional → Lo dictaminó._", opts: [{ l: "Sí", go: "r_sus" }, { l: "No", go: "c" }] },
      c: { q: "¿Empieza con un relativo (_que, quien, el cual, cuyo_) que tiene un antecedente delante?", opts: [{ l: "Sí", go: "d" }, { l: "No", go: "e" }] },
      d: { q: "¿Va entre comas?", opts: [{ l: "Sí", go: "r_exp" }, { l: "No", go: "r_esp" }] },
      e: { q: "¿Se puede reemplazar por _allí, entonces_ o _así_?", h: "_Llegó cuando no lo esperaba → Llegó entonces._", opts: [{ l: "Sí", go: "r_apro" }, { l: "No", go: "f" }] },
      f: { q: "¿Expresa causa, fin, condición o concesión (_porque, para que, si, aunque_)?", opts: [{ l: "Sí", go: "r_aimp" }, { l: "No", go: "g" }] },
      g: { q: "¿Empieza con un relativo sin antecedente (_los que, quien, lo que_)?", opts: [{ l: "Sí", go: "r_lib" }, { l: "No", go: "r_comp" }] },
      r_coor: { r: "Proposición coordinada", x: "La oración es compuesta." },
      r_sus: { r: "Proposición sustantiva", x: "Argumental. Puede ir con _que_, con _si_ (interrogativa total), con qu- (parcial) o en infinitivo." },
      r_exp: { r: "Relativa explicativa", x: "No restringe la referencia del antecedente." },
      r_esp: { r: "Relativa especificativa", x: "Restringe la referencia del antecedente." },
      r_apro: { r: "Adverbial propia", x: "Locativa, temporal o modal. Si la encabeza _donde, cuando_ o _como_, estructuralmente es una relativa libre." },
      r_aimp: { r: "Adverbial impropia", x: "Cosubordinación. Fijate si modifica al SV, al núcleo oracional o a la modalidad." },
      r_lib: { r: "Relativa libre", x: "Funciona como SN o SAdv." },
      r_comp: { r: "Revisá comparativas y consecutivas", x: "_tan… que, más… que_: forman un grupo aparte." }
    }
  }
];

</script>
<script>
/* Corchete · lógica de la app (vanilla JS, sin dependencias) */
(function () {
  "use strict";
  var D = window.CORCHETE;
  var KEY = "corchete.v1";
  var VERSION = 1;

  /* ---------- Estado persistente ---------- */
  var defaults = { version: VERSION, theme: "system", unit: "u1", cards: {}, best: {}, hist: [], an: {} };
  var S = load();
  var saveWarned = false;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(defaults);
      var s = JSON.parse(raw);
      if (!s || s.version !== VERSION) return clone(defaults);
      for (var k in defaults) if (!(k in s)) s[k] = clone(defaults[k]);
      return s;
    } catch (e) { return clone(defaults); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
    catch (e) {
      if (!saveWarned) { toast("No se pudo guardar el progreso en este navegador."); saveWarned = true; }
      return false;
    }
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- Utilidades ---------- */
  function $(sel, el) { return (el || document).querySelector(sel); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/_([^_]+)_/g, "<em>$1</em>");
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function unitById(id) { for (var i = 0; i < D.units.length; i++) if (D.units[i].id === id) return D.units[i]; return D.units[0]; }
  function palItem(pal, id) { var it = D.palettes[pal].items; for (var i = 0; i < it.length; i++) if (it[i].id === id) return it[i]; return null; }
  function accepts(ans, id) { return Array.isArray(ans) ? ans.indexOf(id) > -1 : ans === id; }
  function firstAns(ans) { return Array.isArray(ans) ? ans[0] : ans; }
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function tag(it) { return '<span class="tag" data-c="' + it.c + '">' + esc(it.ab) + "</span>"; }

  /* ---------- Tema ---------- */
  var THEMES = ["system", "light", "dark"];
  var THEME_LABEL = { system: "Tema: sistema", light: "Tema: cuaderno", dark: "Tema: pizarrón" };
  function applyTheme() {
    var r = document.documentElement;
    if (S.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
    var btns = document.querySelectorAll("[data-theme-btn]");
    for (var i = 0; i < btns.length; i++) btns[i].textContent = THEME_LABEL[S.theme];
  }
  function cycleTheme() { S.theme = THEMES[(THEMES.indexOf(S.theme) + 1) % 3]; applyTheme(); save(); }

  /* ---------- Navegación ---------- */
  var VIEWS = ["inicio", "apuntes", "analizar", "pruebas", "fichas", "practica"];
  var ICONS = {
    inicio: '<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    apuntes: '<path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M9 3v18M12 8h4M12 12h4"/>',
    analizar: '<path d="M7 5H4v14h3M17 5h3v14h-3"/><path d="M9 12h6"/>',
    pruebas: '<circle cx="6" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><path d="M8 6h4a4 4 0 0 1 4 4M8 18h4a4 4 0 0 0 4-4"/>',
    fichas: '<rect x="3" y="7" width="14" height="12" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/>',
    practica: '<path d="M9 11l2 2 4-4"/><rect x="4" y="4" width="16" height="16" rx="3"/>'
  };
  var LABELS = { inicio: "Inicio", apuntes: "Apuntes", analizar: "Analizar", pruebas: "Pruebas", fichas: "Fichas", practica: "Práctica" };

  function navHTML() {
    return VIEWS.map(function (v) {
      return '<button class="navbtn" data-go="' + v + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[v] + "</svg><span>" + LABELS[v] + "</span></button>";
    }).join("");
  }
  function current() { var h = location.hash.replace("#", ""); return VIEWS.indexOf(h) > -1 ? h : "inicio"; }
  function go(v) { if (location.hash !== "#" + v) location.hash = v; else render(); }

  function render() {
    var v = current();
    var btns = document.querySelectorAll(".navbtn");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute("data-go") === v) btns[i].setAttribute("aria-current", "page"); else btns[i].removeAttribute("aria-current");
    }
    /* Se reemplaza el contenedor para descartar los listeners de la vista anterior. */
    var old = $("#view"), el = old.cloneNode(false);
    old.parentNode.replaceChild(el, old);
    el.innerHTML = RENDER[v]();
    if (AFTER[v]) AFTER[v](el);
    window.scrollTo(0, 0);
  }

  /* ---------- Progreso ---------- */
  function cardKey(u, i) { return u + ":" + i; }
  function unitProgress(u) {
    var n = u.cards.length, done = 0;
    for (var i = 0; i < n; i++) if ((S.cards[cardKey(u.id, i)] || 0) >= 2) done++;
    return { n: n, done: done, pct: n ? Math.round(done * 100 / n) : 0 };
  }
  function pendingCount(uid) {
    var c = 0;
    D.units.forEach(function (u) {
      if (uid && u.id !== uid) return;
      u.cards.forEach(function (_, i) { if ((S.cards[cardKey(u.id, i)] || 0) < 2) c++; });
    });
    return c;
  }

  /* ---------- Render de una oración analizada ---------- */
  function sentenceHTML(item, opts) {
    opts = opts || {};
    return '<div class="sentence">' + item.parts.map(function (p, i) {
      if (!p[0]) return "";
      if (p[1] === null) return '<span class="plain">' + fmt(p[0]) + "</span>";
      var shown = opts.labels ? opts.labels[i] : null;
      var it = shown ? palItem(item.pal, shown) : null;
      var cls = "cons";
      var fix = "";
      if (opts.checked) {
        var ok = accepts(p[1], shown);
        cls += ok ? " is-ok" : " is-bad";
        if (!ok) fix = '<span class="cons__fix">→ ' + esc(palItem(item.pal, firstAns(p[1])).ab) + "</span>";
      }
      if (opts.active === i) cls += " is-active";
      var inner = '<span class="cons__text">' + fmt(p[0]) + '</span><span class="cons__label">' + (it ? tag(it) : "") + fix + "</span>";
      var c = it ? ' data-c="' + it.c + '"' : "";
      if (opts.interactive) return '<button type="button" class="' + cls + '"' + c + ' data-part="' + i + '" aria-label="' + esc(p[0].replace(/_/g, "")) + (it ? ": " + esc(it.name) : ": sin etiquetar") + '">' + inner + "</button>";
      return '<span class="' + cls + '"' + c + ">" + inner + "</span>";
    }).join("") + "</div>";
  }

  /* ================= INICIO ================= */
  function dailyItem() {
    var fun = D.analysis.filter(function (a) { return a.pal === "fun"; });
    var day = Math.floor(Date.now() / 86400000);
    return fun[day % fun.length];
  }
  function viewInicio() {
    var item = dailyItem();
    var labels = item.parts.map(function (p) { return p[1] === null ? null : firstAns(p[1]); });
    var pend = pendingCount();
    var h = '<header class="pagehead"><span class="eyebrow">Gramática 2025 · Profesorado en Letras · UNaF</span>' +
      "<h1>Cuaderno de análisis</h1>" +
      '<p class="lede">Apuntes, análisis guiado, pruebas de reconocimiento, fichas y práctica, todo con la bibliografía de la cátedra.</p></header>';

    h += '<section class="hero" aria-labelledby="od-title"><span class="eyebrow" id="od-title">Oración del día</span>' +
      sentenceHTML(item, { labels: labels }) +
      '<div class="hero__foot"><span class="src">' + esc(item.src) + '</span><button class="btn btn--primary" data-go="analizar">Analizar oraciones</button></div></section>';

    h += '<section class="quick" aria-label="Accesos rápidos">' +
      '<button data-go="fichas"><strong>Repasar fichas</strong><span>' + pend + " pendientes de " + D.units.reduce(function (a, u) { return a + u.cards.length; }, 0) + "</span></button>" +
      '<button data-sim="1"><strong>Simulacro de 10 preguntas</strong><span>Todas las unidades, con cronómetro</span></button>' +
      '<button data-tree="se"><strong>¿Qué se es?</strong><span>Árbol de decisión de Di Tullio</span></button>' +
      "</section>";

    h += '<section><h2 class="section-title">Unidades <span class="muted small">fichas dominadas · mejor práctica</span></h2><ul class="units">' +
      D.units.map(function (u) {
        var p = unitProgress(u);
        var best = S.best[u.id];
        return '<li><button class="unitrow" data-unit="' + u.id + '"><span class="unitrow__n">' + u.n + '</span><span><span class="unitrow__title">' + esc(u.title) +
          '</span><br><span class="unitrow__meta">' + esc(u.blurb) + '</span></span><span class="unitrow__score"><span class="meter" aria-hidden="true"><i style="width:' + p.pct + '%"></i></span>' +
          p.done + "/" + p.n + " · " + (best != null ? best + "%" : "—") + "</span></button></li>";
      }).join("") + "</ul></section>";

    if (S.hist.length) {
      h += '<section><h2 class="section-title">Últimas prácticas</h2><ul class="history">' +
        S.hist.slice(-5).reverse().map(function (r) {
          var name = r.u === "mix" ? "Todas las unidades" : unitById(r.u).title;
          return "<li><span>" + esc(name) + ' <span class="muted">· ' + (r.m === "sim" ? "simulacro" : "práctica") + "</span></span><span>" + r.s + "/" + r.n + "</span></li>";
        }).join("") + "</ul></section>";
    }
    return h;
  }
  function afterInicio(el) {
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.dataset.unit) { S.unit = b.dataset.unit; save(); go("apuntes"); }
      else if (b.dataset.sim) { PR = { u: "mix", m: "sim" }; startQuiz(); go("practica"); }
      else if (b.dataset.tree) { TR = { id: b.dataset.tree, path: [] }; go("pruebas"); }
    });
  }

  /* ================= APUNTES ================= */
  function unitChips(active, withAll) {
    return '<div class="chips" role="group" aria-label="Unidad">' + (withAll ? '<button class="chip" data-u="all" aria-pressed="' + (active === "all") + '">Todas</button>' : "") +
      D.units.map(function (u) { return '<button class="chip" data-u="' + u.id + '" aria-pressed="' + (active === u.id) + '"><b>' + u.n + "</b>" + esc(u.short) + "</button>"; }).join("") + "</div>";
  }
  function viewApuntes() {
    var u = unitById(S.unit);
    var h = unitChips(u.id);
    h += '<header class="unithead"><h1><small>UNIDAD ' + u.n + "</small>" + esc(u.title) + '</h1><p class="lede">' + esc(u.blurb) + '</p><ul class="sources">' +
      u.sources.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul></header>";
    h += '<ol class="toc">' + u.sections.map(function (s, i) { return '<li><a href="#apuntes" data-sec="' + i + '">' + esc(s.t) + "</a></li>"; }).join("") + "</ol>";
    h += u.sections.map(function (s, i) {
      var b = '<article class="note" id="sec-' + i + '"><h2>' + esc(s.t) + "</h2>";
      (s.p || []).forEach(function (p) { b += "<p>" + fmt(p) + "</p>"; });
      if (s.k) b += "<ul>" + s.k.map(function (k) { return "<li>" + fmt(k) + "</li>"; }).join("") + "</ul>";
      if (s.p2) b += "<p>" + fmt(s.p2) + "</p>";
      if (s.table) {
        b += '<div class="tablewrap"><table><thead><tr>' + s.table.head.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          s.table.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + fmt(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
      }
      if (s.ej) b += '<ul class="examples">' + s.ej.map(function (e) {
        var bad = e.charAt(0) === "*";
        return "<li" + (bad ? ' class="bad"' : "") + ">" + fmt(bad ? e.slice(1) : e) + "</li>";
      }).join("") + "</ul>";
      if (s.src) b += '<span class="src">' + esc(s.src) + "</span>";
      return b + "</article>";
    }).join("");
    var hasTree = D.trees.filter(function (t) { return t.u === u.id; })[0];
    h += '<div class="btnrow"><button class="btn btn--primary" data-act="quiz">Practicar esta unidad</button><button class="btn" data-act="cards">Fichas de esta unidad</button>' +
      (hasTree ? '<button class="btn" data-act="tree" data-id="' + hasTree.id + '">' + esc(hasTree.title) + "</button>" : "") + "</div>";
    return h;
  }
  function afterApuntes(el) {
    el.addEventListener("click", function (e) {
      var a = e.target.closest("[data-sec]");
      if (a) { e.preventDefault(); var t = $("#sec-" + a.dataset.sec); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      var b = e.target.closest("button"); if (!b) return;
      if (b.dataset.u) { S.unit = b.dataset.u; save(); render(); }
      else if (b.dataset.act === "quiz") { PR = { u: S.unit, m: "prac" }; startQuiz(); go("practica"); }
      else if (b.dataset.act === "cards") { FC = { u: S.unit, queue: null }; go("fichas"); }
      else if (b.dataset.act === "tree") { TR = { id: b.dataset.id, path: [] }; go("pruebas"); }
    });
  }

  /* ================= ANALIZAR ================= */
  var AN = { filter: "all", idx: 0, labels: {}, active: null, checked: false };
  var AN_FILTERS = [["all", "Todas"], ["fun", "Funciones"], ["vb", "Construcciones verbales"], ["se", "Valores de se"], ["prop", "Proposiciones"]];
  function anList() { return D.analysis.map(function (a, i) { return i; }).filter(function (i) { return AN.filter === "all" || D.analysis[i].pal === AN.filter; }); }
  function anItem() { var l = anList(); if (AN.idx >= l.length) AN.idx = 0; return { gi: l[AN.idx], item: D.analysis[l[AN.idx]], n: l.length }; }
  function anReset() {
    AN.labels = {}; AN.checked = false; AN.active = null;
    var it = anItem().item;
    for (var i = 0; i < it.parts.length; i++) if (it.parts[i][1] !== null && it.parts[i][0]) { AN.active = i; break; }
  }
  function viewAnalizar() {
    var cur = anItem(), item = cur.item, pal = D.palettes[item.pal];
    var doneN = Object.keys(S.an).length;
    var h = '<header class="pagehead"><span class="eyebrow">Análisis guiado · ' + doneN + " de " + D.analysis.length + ' resueltas</span><h1>Analizar</h1>' +
      '<p class="lede">Tocá cada constituyente entre corchetes y elegí su etiqueta. Cuando termines, comprobá.</p></header>';
    h += '<div class="chips" role="group" aria-label="Tipo de análisis">' + AN_FILTERS.map(function (f) { return '<button class="chip" data-f="' + f[0] + '" aria-pressed="' + (AN.filter === f[0]) + '">' + esc(f[1]) + "</button>"; }).join("") + "</div>";
    h += '<section class="panel" style="display:grid;gap:22px"><div class="qhead"><span>Oración ' + (AN.idx + 1) + " de " + cur.n + " · " + esc(pal.name) + '</span><span class="mono">' + esc(unitById(item.u).short) + "</span></div>";
    h += sentenceHTML(item, { interactive: true, labels: AN.labels, active: AN.checked ? null : AN.active, checked: AN.checked });
    if (!AN.checked) {
      h += '<div class="field"><span>' + (AN.active != null ? "Etiqueta para: " + fmt(item.parts[AN.active][0]) : "Elegí un constituyente") + '</span><div class="palette">' +
        pal.items.map(function (it) { return '<button class="pal" data-lab="' + it.id + '"' + (AN.active == null ? " disabled" : "") + ">" + tag(it) + "<span>" + esc(it.name) + "</span></button>"; }).join("") + "</div></div>";
      var total = item.parts.filter(function (p) { return p[1] !== null && p[0]; }).length;
      var assigned = Object.keys(AN.labels).length;
      h += '<div class="btnrow"><button class="btn btn--primary" data-act="check"' + (assigned < total ? " disabled" : "") + ">Comprobar (" + assigned + "/" + total + ')</button><button class="btn" data-act="show">Ver respuesta</button></div>';
    } else {
      var ok = 0, tot = 0;
      item.parts.forEach(function (p, i) { if (p[1] !== null && p[0]) { tot++; if (accepts(p[1], AN.labels[i])) ok++; } });
      h += '<div class="feedback ' + (ok === tot ? "ok" : "bad") + '" role="status"><strong>' + (ok === tot ? "Todo correcto" : ok + " de " + tot + " correctas") + "</strong></div>";
      h += '<ul class="explain">' + item.parts.map(function (p) {
        if (p[1] === null || !p[0]) return "";
        var it = palItem(item.pal, firstAns(p[1]));
        return "<li>" + tag(it) + '<span><span class="q">' + fmt(p[0]) + "</span>" + (p[2] ? " — " + fmt(p[2]) : "") + "</span></li>";
      }).join("") + "</ul>";
      h += '<span class="src">' + esc(item.src) + "</span>";
    }
    h += '<div class="btnrow"><button class="btn" data-act="prev">Anterior</button><button class="btn" data-act="rand">Al azar</button><button class="btn' + (AN.checked ? " btn--primary" : "") + '" data-act="next">Siguiente</button></div></section>';
    return h;
  }
  function afterAnalizar(el) {
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var cur = anItem(), item = cur.item;
      if (b.dataset.f) { AN.filter = b.dataset.f; AN.idx = 0; anReset(); render(); return; }
      if (b.dataset.part != null && !AN.checked) { AN.active = +b.dataset.part; rerender(); return; }
      if (b.dataset.lab && AN.active != null) {
        AN.labels[AN.active] = b.dataset.lab;
        var nxt = null;
        for (var i = 0; i < item.parts.length; i++) { var j = (AN.active + 1 + i) % item.parts.length; if (item.parts[j][1] !== null && item.parts[j][0] && !(j in AN.labels)) { nxt = j; break; } }
        AN.active = nxt != null ? nxt : AN.active;
        rerender(); return;
      }
      var act = b.dataset.act;
      if (act === "check" || act === "show") {
        if (act === "show") item.parts.forEach(function (p, i) { if (p[1] !== null && p[0] && !(i in AN.labels)) AN.labels[i] = firstAns(p[1]); });
        AN.checked = true;
        if (act === "check") { S.an[cur.gi] = 1; save(); }
        rerender(); return;
      }
      if (act === "next") { AN.idx = (AN.idx + 1) % cur.n; anReset(); rerender(); }
      if (act === "prev") { AN.idx = (AN.idx - 1 + cur.n) % cur.n; anReset(); rerender(); }
      if (act === "rand") { AN.idx = Math.floor(Math.random() * cur.n); anReset(); rerender(); }
    });
  }
  function rerender() {
    var y = window.scrollY; var el = $("#view"); el.innerHTML = RENDER[current()](); window.scrollTo(0, y);
  }

  /* ================= PRUEBAS ================= */
  var TR = null;
  function treeById(id) { for (var i = 0; i < D.trees.length; i++) if (D.trees[i].id === id) return D.trees[i]; return null; }
  function viewPruebas() {
    var h = '<header class="pagehead"><span class="eyebrow">Pruebas de reconocimiento</span><h1>Pruebas</h1><p class="lede">Árboles de decisión armados con las pruebas de la bibliografía. Respondé paso a paso sobre tu oración.</p></header>';
    if (!TR || !treeById(TR.id)) {
      return h + '<div class="treelist">' + D.trees.map(function (t) {
        return '<button class="treecard" data-tree="' + t.id + '"><span class="mono small" style="color:var(--margin)">Unidad ' + unitById(t.u).n + "</span><strong>" + esc(t.title) + "</strong><span>" + esc(t.desc) + "</span></button>";
      }).join("") + "</div>";
    }
    var t = treeById(TR.id);
    var nodeId = TR.path.length ? TR.path[TR.path.length - 1].go : t.start;
    var node = t.nodes[nodeId];
    h = '<header class="pagehead"><span class="eyebrow">Unidad ' + unitById(t.u).n + " · Pruebas</span><h1>" + esc(t.title) + "</h1></header>";
    if (TR.path.length) {
      h += '<ol class="trail">' + TR.path.map(function (s) { return "<li><span>" + fmt(t.nodes[s.from].q) + "</span><b>" + fmt(s.l) + "</b></li>"; }).join("") + "</ol>";
    }
    h += '<section class="panel step" aria-live="polite">';
    if (node.r) {
      h += '<div class="result"><span class="eyebrow">Resultado</span><h2>' + esc(node.r) + "</h2><p>" + fmt(node.x) + "</p></div>";
    } else {
      h += "<h2>" + fmt(node.q) + "</h2>" + (node.h ? '<p class="help">' + fmt(node.h) + "</p>" : "") +
        '<div class="opts">' + node.opts.map(function (o, i) { return '<button class="opt" data-opt="' + i + '">' + fmt(o.l) + "</button>"; }).join("") + "</div>";
    }
    h += '</section><div class="btnrow">' + (TR.path.length ? '<button class="btn" data-act="back">Paso atrás</button><button class="btn" data-act="restart">Empezar de nuevo</button>' : "") +
      '<button class="btn" data-act="list">Todas las pruebas</button></div>';
    return h;
  }
  function afterPruebas(el) {
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.dataset.tree) { TR = { id: b.dataset.tree, path: [] }; render(); return; }
      if (!TR) return;
      var t = treeById(TR.id);
      if (b.dataset.opt != null) {
        var from = TR.path.length ? TR.path[TR.path.length - 1].go : t.start;
        var o = t.nodes[from].opts[+b.dataset.opt];
        TR.path.push({ from: from, go: o.go, l: o.l }); rerender(); return;
      }
      if (b.dataset.act === "back") { TR.path.pop(); rerender(); }
      if (b.dataset.act === "restart") { TR.path = []; rerender(); }
      if (b.dataset.act === "list") { TR = null; render(); }
    });
  }

  /* ================= FICHAS ================= */
  var FC = { u: "all", queue: null, flipped: false, all: false };
  function buildQueue() {
    var q = [];
    D.units.forEach(function (u) {
      if (FC.u !== "all" && u.id !== FC.u) return;
      u.cards.forEach(function (c, i) { var bx = S.cards[cardKey(u.id, i)] || 0; if (FC.all || bx < 2) q.push({ u: u.id, i: i, bx: bx }); });
    });
    q = shuffle(q).sort(function (a, b) { return a.bx - b.bx; });
    FC.queue = q; FC.flipped = false;
  }
  function boxCounts() {
    var c = [0, 0, 0];
    D.units.forEach(function (u) {
      if (FC.u !== "all" && u.id !== FC.u) return;
      u.cards.forEach(function (_, i) { c[S.cards[cardKey(u.id, i)] || 0]++; });
    });
    return c;
  }
  function viewFichas() {
    if (!FC.queue) buildQueue();
    var c = boxCounts();
    var h = '<header class="pagehead"><span class="eyebrow">Repaso espaciado</span><h1>Fichas</h1><p class="lede">Leé la pregunta, pensá la respuesta y girá la ficha. Si la sabías, pasa a dominadas; si no, vuelve al repaso.</p></header>';
    h += unitChips(FC.u, true);
    h += '<div class="boxes"><div><b>' + c[0] + "</b><span>Nuevas</span></div><div><b>" + c[1] + "</b><span>En repaso</span></div><div><b>" + c[2] + "</b><span>Dominadas</span></div></div>";
    if (!FC.queue.length) {
      h += '<section class="panel step"><h2>No quedan fichas pendientes</h2><p class="muted">Dominaste todas las fichas de esta selección.</p><div class="btnrow"><button class="btn btn--primary" data-act="all">Repasar todas igual</button><button class="btn" data-act="reset">Reiniciar esta selección</button></div></section>';
      return h;
    }
    var cur = FC.queue[0], u = unitById(cur.u), card = u.cards[cur.i];
    h += '<div class="qhead"><span>' + FC.queue.length + " en la pila" + (FC.all ? " (todas)" : "") + '</span><span class="mono">U' + u.n + " · " + esc(u.short) + "</span></div>";
    h += '<div class="flash' + (FC.flipped ? " is-flipped" : "") + '"><div class="flash__inner" role="button" tabindex="0" data-act="flip" aria-label="Girar ficha">' +
      '<div class="flash__face"><span class="flash__hint">Pregunta</span><p>' + fmt(card.f) + '</p></div>' +
      '<div class="flash__face flash__face--back"><span class="flash__hint">Respuesta</span><p>' + fmt(card.b) + "</p></div></div></div>";
    h += '<div class="btnrow">' + (FC.flipped ? '<button class="btn" data-act="again">Repasar</button><button class="btn btn--primary" data-act="know">La sé</button>' : '<button class="btn btn--primary" data-act="flip">Girar ficha</button>') + "</div>";
    return h;
  }
  function afterFichas(el) {
    function flip() { FC.flipped = !FC.flipped; var f = $(".flash", el); if (f) f.classList.toggle("is-flipped", FC.flipped); var row = $(".btnrow", el); if (row) row.innerHTML = FC.flipped ? '<button class="btn" data-act="again">Repasar</button><button class="btn btn--primary" data-act="know">La sé</button>' : '<button class="btn btn--primary" data-act="flip">Girar ficha</button>'; }
    el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-u],[data-act]"); if (!b) return;
      if (b.dataset.u) { FC.u = b.dataset.u; FC.all = false; buildQueue(); rerender(); return; }
      var a = b.dataset.act;
      if (a === "flip") { flip(); return; }
      if (a === "know" || a === "again") {
        var cur = FC.queue.shift(), k = cardKey(cur.u, cur.i);
        if (a === "know") S.cards[k] = 2;
        else { S.cards[k] = 1; FC.queue.push({ u: cur.u, i: cur.i, bx: 1 }); }
        save(); FC.flipped = false; rerender(); return;
      }
      if (a === "all") { FC.all = true; buildQueue(); rerender(); }
      if (a === "reset") {
        D.units.forEach(function (u) { if (FC.u !== "all" && u.id !== FC.u) return; u.cards.forEach(function (_, i) { delete S.cards[cardKey(u.id, i)]; }); });
        save(); FC.all = false; buildQueue(); rerender(); toast("Fichas reiniciadas.");
      }
    });
    el.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("flash__inner")) { e.preventDefault(); flip(); }
    });
  }

  /* ================= PRÁCTICA ================= */
  var PR = { u: "all", m: "prac" };
  var QZ = null;
  function startQuiz() {
    var pool = [];
    D.units.forEach(function (u) { if (PR.u !== "mix" && PR.u !== "all" && u.id !== PR.u) return; u.quiz.forEach(function (q, i) { pool.push({ u: u.id, q: q, i: i }); }); });
    pool = shuffle(pool);
    if (PR.m === "sim") pool = pool.slice(0, 10);
    else if (PR.u === "all" || PR.u === "mix") pool = pool.slice(0, 15);
    QZ = {
      items: pool.map(function (p) { var order = shuffle(p.q.o.map(function (_, i) { return i; })); return { u: p.u, q: p.q, order: order, pick: null }; }),
      i: 0, t0: Date.now(), done: false, u: PR.u === "all" ? "mix" : PR.u, m: PR.m
    };
  }
  function viewPractica() {
    var h;
    if (!QZ) {
      h = '<header class="pagehead"><span class="eyebrow">Autoevaluación</span><h1>Práctica</h1><p class="lede">Elegí una unidad y un modo. En práctica ves la explicación después de cada respuesta; el simulacro corrige al final.</p></header>';
      h += '<section class="panel setup"><div class="field"><span>Unidad</span>' + unitChips(PR.u === "mix" ? "all" : PR.u, true) + "</div>" +
        '<div class="field"><span>Modo</span><div class="seg"><button class="chip" data-m="prac" aria-pressed="' + (PR.m === "prac") + '">Práctica con explicación</button><button class="chip" data-m="sim" aria-pressed="' + (PR.m === "sim") + '">Simulacro · 10 preguntas</button></div></div>' +
        '<div class="btnrow"><button class="btn btn--primary" data-act="start">Empezar</button></div></section>';
      if (S.hist.length) {
        h += '<section><h2 class="section-title">Historial</h2><ul class="history">' + S.hist.slice(-10).reverse().map(function (r) {
          var d = new Date(r.t);
          return "<li><span>" + esc(r.u === "mix" ? "Todas las unidades" : unitById(r.u).title) + ' <span class="muted">· ' + (r.m === "sim" ? "simulacro" : "práctica") + " · " + d.toLocaleDateString("es-AR") + "</span></span><span>" + r.s + "/" + r.n + "</span></li>";
        }).join("") + "</ul></section>";
      }
      return h;
    }
    if (QZ.done) return viewResults();
    var it = QZ.items[QZ.i], q = it.q, n = QZ.items.length;
    h = '<div class="qhead"><span>Pregunta ' + (QZ.i + 1) + " de " + n + '</span><span class="mono">' + (QZ.m === "sim" ? '<span id="clock">0:00</span> · ' : "") + "U" + unitById(it.u).n + "</span></div>";
    h += '<div class="progress"><i style="width:' + Math.round(QZ.i * 100 / n) + '%"></i></div>';
    h += '<section class="panel step"><p class="question">' + fmt(q.q) + '</p><div class="answers">' + it.order.map(function (oi, k) {
      var cls = "answer";
      var reveal = QZ.m === "prac" && it.pick !== null;
      if (reveal) { if (oi === q.a) cls += " is-ok"; else if (oi === it.pick) cls += " is-bad"; }
      else if (it.pick === oi) cls += " is-picked";
      return '<button class="' + cls + '" data-pick="' + oi + '"' + (reveal ? " disabled" : "") + "><b>" + "abcd".charAt(k) + ")</b><span>" + fmt(q.o[oi]) + "</span></button>";
    }).join("") + "</div>";
    if (QZ.m === "prac" && it.pick !== null) {
      var ok = it.pick === q.a;
      h += '<div class="feedback ' + (ok ? "ok" : "bad") + '" role="status"><strong>' + (ok ? "Correcto" : "Incorrecto") + "</strong><span>" + fmt(q.x) + "</span></div>";
    }
    h += "</section>";
    var canNext = it.pick !== null;
    h += '<div class="btnrow"><button class="btn btn--primary" data-act="next"' + (canNext ? "" : " disabled") + ">" + (QZ.i === n - 1 ? "Ver resultado" : "Siguiente") + '</button><button class="btn" data-act="quit">Salir</button></div>';
    return h;
  }
  function viewResults() {
    var ok = QZ.items.filter(function (it) { return it.pick === it.q.a; }).length, n = QZ.items.length;
    var secs = Math.round((QZ.t1 - QZ.t0) / 1000);
    var h = '<header class="pagehead"><span class="eyebrow">' + (QZ.m === "sim" ? "Simulacro" : "Práctica") + " · " + esc(QZ.u === "mix" ? "Todas las unidades" : unitById(QZ.u).title) + "</span>" +
      '<div class="score">' + ok + "<small> / " + n + "</small></div>" +
      '<p class="lede">' + Math.round(ok * 100 / n) + "% de aciertos" + (QZ.m === "sim" ? " en " + Math.floor(secs / 60) + ":" + ("0" + (secs % 60)).slice(-2) : "") + ".</p></header>";
    var wrong = QZ.items.filter(function (it) { return it.pick !== it.q.a; });
    if (wrong.length) {
      h += '<section><h2 class="section-title">Para revisar</h2><ul class="reviewlist">' + wrong.map(function (it) {
        return '<li><span class="question" style="font-size:1rem">' + fmt(it.q.q) + '</span><span><span class="muted">Tu respuesta:</span> ' + fmt(it.q.o[it.pick]) + '</span><span><span class="muted">Correcta:</span> <strong>' + fmt(it.q.o[it.q.a]) + "</strong></span><span>" + fmt(it.q.x) + "</span></li>";
      }).join("") + "</ul></section>";
    } else h += '<div class="feedback ok"><strong>Sin errores</strong><span>Respondiste todo bien.</span></div>';
    h += '<div class="btnrow"><button class="btn btn--primary" data-act="again">Repetir</button><button class="btn" data-act="setup">Elegir otra práctica</button></div>';
    return h;
  }
  function finishQuiz() {
    QZ.done = true; QZ.t1 = Date.now();
    var ok = QZ.items.filter(function (it) { return it.pick === it.q.a; }).length, n = QZ.items.length;
    var pct = Math.round(ok * 100 / n);
    if (QZ.u !== "mix") S.best[QZ.u] = Math.max(S.best[QZ.u] || 0, pct);
    S.hist.push({ t: Date.now(), u: QZ.u, s: ok, n: n, m: QZ.m });
    if (S.hist.length > 40) S.hist = S.hist.slice(-40);
    save();
  }
  var clockTimer = null;
  function afterPractica(el) {
    clearInterval(clockTimer);
    if (QZ && !QZ.done && QZ.m === "sim") {
      clockTimer = setInterval(function () {
        var c = $("#clock"); if (!c) { clearInterval(clockTimer); return; }
        var s = Math.round((Date.now() - QZ.t0) / 1000); c.textContent = Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
      }, 1000);
    }
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (!QZ) {
        if (b.dataset.u) { PR.u = b.dataset.u === "all" ? "all" : b.dataset.u; rerender(); }
        if (b.dataset.m) { PR.m = b.dataset.m; rerender(); }
        if (b.dataset.act === "start") { startQuiz(); render(); }
        return;
      }
      if (b.dataset.pick != null) {
        var it = QZ.items[QZ.i];
        if (QZ.m === "prac" && it.pick !== null) return;
        it.pick = +b.dataset.pick; rerender(); return;
      }
      var a = b.dataset.act;
      if (a === "next") { if (QZ.i < QZ.items.length - 1) { QZ.i++; render(); } else { finishQuiz(); render(); } }
      if (a === "quit" || a === "setup") { QZ = null; render(); }
      if (a === "again") { startQuiz(); render(); }
    });
  }

  /* ---------- Registro de vistas ---------- */
  var RENDER = { inicio: viewInicio, apuntes: viewApuntes, analizar: viewAnalizar, pruebas: viewPruebas, fichas: viewFichas, practica: viewPractica };
  var AFTER = { inicio: afterInicio, apuntes: afterApuntes, analizar: afterAnalizar, pruebas: afterPruebas, fichas: afterFichas, practica: afterPractica };

  /* ---------- Instalación como app (PWA) ---------- */
  function setupPWA() {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register("sw.js").catch(function () { /* sin service worker la app funciona igual */ });
    }
    var deferred = null;
    var btns = document.querySelectorAll("[data-install]");
    function show(on) { for (var i = 0; i < btns.length; i++) btns[i].hidden = !on; }
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; show(true); });
    window.addEventListener("appinstalled", function () { deferred = null; show(false); toast("Corchete quedó instalada."); });
    for (var i = 0; i < btns.length; i++) btns[i].addEventListener("click", function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.finally(function () { deferred = null; show(false); });
    });
  }

  /* ---------- Arranque ---------- */
  function boot() {
    applyTheme();
    document.querySelectorAll("[data-nav]").forEach(function (n) { n.innerHTML = navHTML(); });
    document.addEventListener("click", function (e) {
      var g = e.target.closest("[data-go]");
      if (g && !e.target.closest("#view [data-unit]")) { go(g.dataset.go); }
      if (e.target.closest("[data-theme-btn]")) cycleTheme();
    });
    window.addEventListener("hashchange", render);
    anReset();
    render();
    setupPWA();

    var sp = $("#splash");
    if (sp) {
      requestAnimationFrame(function () { sp.classList.add("ready"); });
      var hide = function () { sp.classList.add("out"); setTimeout(function () { sp.hidden = true; }, 520); };
      var t = setTimeout(hide, 1500);
      sp.addEventListener("click", function () { clearTimeout(t); hide(); });
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>

</body>
</html>
